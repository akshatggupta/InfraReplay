# The full stack, each service the same image in a different role.
#
#   docker compose up --build
#
# With Prometheus (:9090) and Grafana (:3001, dashboard preloaded):
#
#   docker compose --profile observability up --build
#
# Single container instead (no Postgres, nothing else to install):
#
#   docker build -t infrareplay .
#   docker run --rm -p 8000:8000 -p 8080:8080 -p 3000:3000 -p 4000:4000 -p 8081:8081 infrareplay

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: infrareplay
      POSTGRES_PASSWORD: infrareplay
      POSTGRES_DB: infrareplay
    # Not published: the other services reach it over the compose network, and
    # binding 5432 collides with any Postgres already running on the host.
    # Add `ports: ["5432:5432"]` if you want to attach psql from outside.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infrareplay"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      INFRAREPLAY_ROLE: api
      INFRAREPLAY_DATABASE_URL: postgresql+asyncpg://infrareplay:infrareplay@postgres:5432/infrareplay
      INFRAREPLAY_BLOB_ROOT: /data/blobs
      # Where real demo traffic is recorded from, and what replay targets.
      INFRAREPLAY_DEMO_SHOP_URL: http://shop:3000
    volumes:
      - blobs:/data/blobs
    ports:
      - "8000:8000"
      # Where `infractl capture start --listen :8081` listens.
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  shop:
    build: .
    environment:
      INFRAREPLAY_ROLE: shop
      # Shares the Postgres instance; its tables do not overlap InfraReplay's.
      DEMO_SHOP_DATABASE_URL: postgresql+asyncpg://infrareplay:infrareplay@postgres:5432/infrareplay
      INFRAREPLAY_API_URL: http://api:8000
      DEMO_SHOP_PAYMENTS_URL: http://payments:4000
      # Set to "1" to switch the inventory bug off (or flip it at runtime:
      # POST /api/v1/admin/inventory-lock?enabled=true).
      DEMO_SHOP_LOCK_INVENTORY: "0"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      payments:
        condition: service_healthy

  # The external service the shop charges cards on (v11); its ledger is at
  # http://localhost:4000/v1/charges.
  payments:
    build: .
    environment:
      INFRAREPLAY_ROLE: payments
    ports:
      - "4000:4000"

  dashboard:
    build: .
    environment:
      INFRAREPLAY_ROLE: dashboard
      INFRAREPLAY_API_URL: http://api:8000
      INFRAREPLAY_DASHBOARD_PORT: "8080"
    ports:
      # Host port overridable when 8080 is taken: INFRAREPLAY_DASHBOARD_HOST_PORT=8088
      - "${INFRAREPLAY_DASHBOARD_HOST_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  # One-shot: records real demo traffic once the stack is up, then exits.
  seed:
    build: .
    command: ["python", "/app/docker/seed.py"]
    environment:
      INFRAREPLAY_API_URL: http://api:8000
      INFRAREPLAY_DEMO_SHOP_URL: http://shop:3000
    depends_on:
      api:
        condition: service_healthy
      shop:
        condition: service_healthy
    restart: "no"

  # ---- v9, opt-in: docker compose --profile observability up --build ------

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    volumes:
      - ./docs/grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      # Read-only anonymous viewing, so the demo opens straight onto the dashboard.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/infrareplay-dashboard.json
    volumes:
      - ./docs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/grafana/infrareplay-dashboard.json:/var/lib/grafana/dashboards/infrareplay-dashboard.json:ro
    ports:
      # 3000 is the demo shop.
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  blobs:
