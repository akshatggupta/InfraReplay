# The full stack, each service the same image in a different role.
#
#   docker compose up --build
#
# Single container instead (no Postgres, nothing else to install):
#
#   docker build -t infrareplay .
#   docker run --rm -p 8000:8000 -p 8080:8080 -p 3000:3000 -p 8081:8081 infrareplay

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: infrareplay
      POSTGRES_PASSWORD: infrareplay
      POSTGRES_DB: infrareplay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infrareplay"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      INFRAREPLAY_ROLE: api
      INFRAREPLAY_DATABASE_URL: postgresql+asyncpg://infrareplay:infrareplay@postgres:5432/infrareplay
      INFRAREPLAY_BLOB_ROOT: /data/blobs
    volumes:
      - blobs:/data/blobs
    ports:
      - "8000:8000"
      # Where `infractl capture start --listen :8081` listens.
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  shop:
    build: .
    environment:
      INFRAREPLAY_ROLE: shop
      # Shares the Postgres instance; its tables do not overlap InfraReplay's.
      DEMO_SHOP_DATABASE_URL: postgresql+asyncpg://infrareplay:infrareplay@postgres:5432/infrareplay
      INFRAREPLAY_API_URL: http://api:8000
      # Set to "1" to switch the inventory bug off.
      DEMO_SHOP_LOCK_INVENTORY: "0"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: .
    environment:
      INFRAREPLAY_ROLE: dashboard
      INFRAREPLAY_API_URL: http://api:8000
      INFRAREPLAY_DASHBOARD_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

  # One-shot: seeds the fixture recordings once the API is up, then exits.
  seed:
    build: .
    command: ["python", "/app/docker/seed.py"]
    environment:
      INFRAREPLAY_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  blobs:
